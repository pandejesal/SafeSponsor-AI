name: Teardown Daily 09:00

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate teardown
        run: node scripts/generate-teardown.js
      - name: Commit and push if changed
        run: |
          git config user.name "teardown-bot"
          git config user.email "teardown-bot@users.noreply.github.com"
          git add content/blog/*.md || true
          if git diff --cached --quiet; then
            echo "No new teardown"
            exit 0
          fi
          git commit -m "feat: daily DTC-niche teardown $(date -u +%Y-%m-%d) (Q6.A/Q11.A/Q15.B/Q18.B/Q22.A, real teaser or evergreen_fallback)"
          git push origin main
